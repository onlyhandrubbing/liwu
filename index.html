const has=(field,k)=>field==='*'||field.split(' ').includes(k);

let st=Object.assign({occ:'xchg',rel:'st',age:'y',gen:'a',bud:500},LS.get('lw_st',{}));
let seed=0,msgI=0;

function chips(id,list,key){$(id).innerHTML=list.map(([v,l])=>`<button class="chip" type="button" data-v="${v}" aria-pressed="${String(st[key])===String(v)}">${l}</button>`).join('');

chips('c-occ',OCC,'occ');chips('c-rel',REL,'rel');chips('c-age',AGE,'age');chips('c-gen',GEN,'gen');chips('c-bud',BUD,'bud');

function rnd(i){let x=Math.sin(i*99.13+seed*7.7)*10000;return x-Math.floor(x)}
function picks(){const B=st.bud;
  let list=G.map((g,i)=>({g,i})).filter(({g})=>{const[,,mn,mx,occ,rel,age,gen]=g;
    if(!has(occ,st.occ)||(!has(rel,st.rel)&&!['cny','house'].includes(st.occ)))return false;if(!age.includes(st.age))return false;if(gen!=='a'&&st.gen!=='a'&&gen!==st.gen)return false;if(gen==='f'&&st.gen==='a'&&!['pt','cr','fr'].includes(st.rel))return false;
    return mn<=B&&mx>=B*(B>=3000?0.3:0.45)});
  list.forEach(o=>{const g=o.g;let s=0;if(g[4]!=='*')s+=2;if(g[5]!=='*')s+=2;if(g[6].length<3)s+=1;const mid=(g[2]+g[3])/2;s-=Math.abs(mid-B)/B;o.s=s+rnd(o.i)*1.6});
  return list.sort((a,b)=>b.s-a.s)}
/* landmines */

 ['⚖️','減肥、美白、除臭類商品','像在暗示對方哪裡不好','*','*'],

function booms(){const sp=b=>(b[3]!=='*'?2:0)+(b[4]!=='*'?1:0);return BOOM.filter(b=>has(b[3],st.occ)&&has(b[4],st.rel)).map((b,i)=>[b,i]).sort((x,y)=>sp(y[0])-sp(x[0])||x[1]-y[1]).map(x=>x[0]).slice(0,6)}

  g.fillStyle='#fff4d9';g.fillRect(0,0,W,H);g.fillStyle='#ffe8b3';for(let x=-H;x<W;x+=104){g.beginPath();g.moveTo(x,H);g.lineTo(x+H,0);g.lineTo(x+H+36,0);g.lineTo(x+36,H);g.fill()}
